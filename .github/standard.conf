# repo-standard's own config (.github/standard/README.md, Rules). repo-standard follows its own
# standard: its canonical files are live here, and each release rebuilds the MANIFEST
# (ROLE=source).
NAME=repo-standard
VISIBILITY=public
ROLE=source
# test runs on Windows in Git Bash, with the smoke test of the pinned PowerShell modules; system
# runs on Linux, lint included, and both run the suites in the two scratch consumers.
CI_RUNNER=windows
CI_STAGES=test system
PS_MODULES=pester psscriptanalyzer
RELEASE_KIND=tar
# The MANIFEST that tools/sync and tools/status compare, and the seal tool, which the owner
# installs only from a verified asset.
RELEASE_ASSETS=.github/standard/MANIFEST tools/release-seal tools/release-seal-askpass tools/release-seal.ps1
PRIVACY_RULES=base
